<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>디자인 갤러리 v3</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#0a0a0e;color:#fff;min-height:100vh}

/* ── 헤더 ── */
.hdr{padding:60px 48px 32px;text-align:center}
.hdr-logo{font-size:52px;font-weight:900;letter-spacing:-2px;margin-bottom:14px;background:linear-gradient(135deg,#ffffff 0%,#c8c8ff 40%,rgba(255,255,255,.55) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.25;padding:0 6px 10px;display:inline-block}
.hdr-divline{width:40px;height:2px;background:rgba(255,255,255,.15);margin:0 auto 18px;border-radius:2px}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px}
.hdr p{font-size:11px;color:rgba(255,255,255,.22);letter-spacing:1.5px;margin-bottom:20px}
.hdr-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hdr-badge{font-size:12px;font-weight:700;color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:8px 18px;border-radius:100px;letter-spacing:.5px}
.hdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);margin:0 48px}

/* ── 탭 ── */
.tabs{display:flex;gap:8px;justify-content:center;padding:28px 0 22px}
.tb{padding:11px 36px;border-radius:100px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.38);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .25s;letter-spacing:.3px}
.tb:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.22)}
.tb.on{background:#fff;color:#0a0a0e;border-color:#fff;box-shadow:0 0 28px rgba(255,255,255,.15)}

/* ── 갤러리 ── */
.tc{display:none;padding:8px 40px 80px}
.tc.on{display:block}
.gl{display:grid;gap:14px;max-width:1540px;margin:0 auto}

/* ── 카드 ── */
.gi{cursor:pointer;border-radius:12px;overflow:hidden;background:#111116;border:1px solid rgba(255,255,255,.05);transition:all .24s}
.gi:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.18);box-shadow:0 20px 52px rgba(0,0,0,.65)}

/* ── 썸네일 프리뷰 — 순 흰 배경, 디자인이 액자처럼 ── */
.pw{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;padding:0}

/* ── 번호 배지 ── */
.dn{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.48);color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.8px;z-index:2}

/* ── 카드 하단 정보 ── */
.ii{padding:10px 13px 12px}
.ii .nm{font-size:11px;font-weight:700;color:#e2e2e2;margin-bottom:4px;line-height:1.4}
.ii .tg{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:.2px}

/* ── 모달 오버레이 ── */
.ovl{display:none;position:fixed;inset:0;background:rgba(4,4,8,.96);z-index:999;align-items:center;justify-content:center}
.ovl.on{display:flex}

/* ── 모달 박스 ── */
.mbx{background:#0e0e14;border-radius:20px;border:1px solid rgba(255,255,255,.09);padding:32px;max-width:840px;width:95%;position:relative;max-height:93vh;overflow-y:auto;scrollbar-width:none}
.mbx::-webkit-scrollbar{display:none}
.mcl{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.06);border:none;color:rgba(255,255,255,.45);font-size:18px;cursor:pointer;line-height:1;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:.15s}
.mcl:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── 모달 프리뷰 — 흰 배경 ── */
.mpr{display:flex;justify-content:center;margin-bottom:22px;background:#fff;border-radius:12px;overflow:hidden;padding:16px}

/* ── 모달 메타 ── */
.mnm{font-size:18px;font-weight:800;color:#fff;margin-bottom:7px;letter-spacing:-.3px}
.mtg{font-size:10.5px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);padding:3px 10px;border-radius:5px;display:inline-block;letter-spacing:.8px;text-transform:uppercase}
.mmt{font-size:10px;color:rgba(255,255,255,.18);margin-top:8px;letter-spacing:.5px}


/* ── 카드 호버 글로우 ── */
.gi{cursor:pointer;border-radius:14px;overflow:hidden;background:#111116;border:1px solid rgba(255,255,255,.05);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,border-color .22s}
.gi:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(255,255,255,.18);box-shadow:0 24px 56px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}

/* ── 번호 배지 ── */
.dn{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:rgba(255,255,255,.5);font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.8px;z-index:3;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06)}

/* ── 카드 정보 ── */
.ii{padding:11px 13px 13px;background:#0e0e12;border-top:1px solid rgba(255,255,255,.04)}
.ii .nm{font-size:11.5px;font-weight:700;color:#e4e4e4;margin-bottom:4px;line-height:1.3;letter-spacing:-.2px}
.ii .tg{font-size:9.5px;color:rgba(255,255,255,.28);letter-spacing:.3px}

/* ── 모달 애니메이션 ── */
.ovl{display:none;position:fixed;inset:0;background:rgba(4,4,8,.96);z-index:999;align-items:center;justify-content:center;opacity:0;transition:opacity .18s}
.ovl.on{display:flex;animation:fadeIn .18s forwards}
@keyframes fadeIn{to{opacity:1}}
.mbx{background:#0c0c12;border-radius:20px;border:1px solid rgba(255,255,255,.1);padding:32px;max-width:840px;width:95%;position:relative;max-height:93vh;overflow-y:auto;scrollbar-width:none;animation:slideUp .22s cubic-bezier(.34,1.4,.64,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.mbx::-webkit-scrollbar{display:none}
.mcl{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.07);border:none;color:rgba(255,255,255,.5);font-size:16px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:.15s}
.mcl:hover{background:rgba(255,255,255,.14);color:#fff}
.mpr{display:flex;justify-content:center;margin-bottom:22px;background:#fff;border-radius:12px;overflow:hidden;padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.mnm{font-size:18px;font-weight:800;color:#fff;margin-bottom:7px;letter-spacing:-.4px}
.mtg{font-size:10.5px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);padding:3px 10px;border-radius:6px;display:inline-block;letter-spacing:.8px;border:1px solid rgba(255,255,255,.07)}
.mmt{font-size:10px;color:rgba(255,255,255,.2);margin-top:8px;letter-spacing:.5px}

/* ── 헤더 개선 ── */
.hdr-logo{font-size:52px;font-weight:900;letter-spacing:-2.5px;margin-bottom:16px;background:linear-gradient(135deg,#ffffff 0%,#e0d4ff 40%,rgba(255,255,255,.45) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;padding:0 6px 10px;display:inline-block}
.hdr h1{font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:10px}
.hdr-divline{width:36px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.1));margin:0 auto 16px;border-radius:2px}
.hdr p{font-size:11px;color:rgba(255,255,255,.22);letter-spacing:1.5px;margin-bottom:22px}
.hdr-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hdr-badge{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:7px 18px;border-radius:100px;letter-spacing:.3px;transition:.2s}
.hdr-badge:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.hdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);margin:0 48px}

/* ── 탭 ── */
.tabs{display:flex;gap:8px;justify-content:center;padding:28px 0 24px}
.tb{padding:11px 36px;border-radius:100px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.38);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .25s cubic-bezier(.34,1.4,.64,1);letter-spacing:.3px}
.tb:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.25);transform:scale(1.03)}
.tb.on{background:#fff;color:#0a0a0e;border-color:#fff;box-shadow:0 0 32px rgba(255,255,255,.18)}

/* ── 갤러리 ── */
.tc{display:none;padding:8px 40px 80px}
.tc.on{display:block}
.gl{display:grid;gap:14px;max-width:1540px;margin:0 auto}
.pw{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;padding:0;overflow:hidden}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#08090f;color:#fff;min-height:100vh}
/* ── 모바일 최적화 ── */
@media(max-width:768px){
  .hdr{padding:40px 20px 24px}
  .hdr-logo{font-size:38px;letter-spacing:-1.5px}
  .hdr h1{font-size:13px;letter-spacing:3px}
  .hdr p{font-size:10px;letter-spacing:1px}
  .hdr-badges{gap:6px}
  .hdr-badge{font-size:11px;padding:6px 13px}
  .hdiv{margin:0 20px}
  .tabs{padding:18px 0 14px;gap:6px}
  .tb{padding:9px 18px;font-size:12px}
  .tc{padding:6px 14px 60px}
  .gl{gap:8px}
  .ii{padding:8px 10px 10px}
  .ii .nm{font-size:10.5px}
  .ii .tg{font-size:9.5px}
  .dn{font-size:8px;padding:2px 5px}
  /* 모달 — 모바일에서 전체화면 */
  .ovl{align-items:flex-end}
  .mbx{border-radius:20px 20px 0 0;max-width:100%;width:100%;max-height:88vh;padding:24px 20px 32px;border-bottom:none}
  .mpr{padding:10px;margin-bottom:16px}
  .mnm{font-size:15px}
}
@media(max-width:480px){
  .hdr-logo{font-size:32px}
  .hdr h1{font-size:12px;letter-spacing:2px}
  .hdr p{display:none}
  .tc{padding:4px 10px 60px}
  .gl{gap:6px}
  .ii{padding:7px 8px 9px}
  .ii .nm{font-size:10px}
  .ii .tg{font-size:9px}
}
/* 탭 스크롤 방지, 터치 개선 */
.tb{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gi{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>

  return `<div style="position:relative;width:${W}px;height:${H}px;overflow:hidden;border-radius:${Math.round(6*scale)}px;flex-shrink:0">${d.render(W,H,scale)}</div>`;
}
function buildGallery(designs,type,cid){
  const el=document.getElementById(cid);
  const isPPT=type==='ppt';
  const BW=isPPT?360:196, BH=isPPT?202:261;
  const ratio=(BH/BW*100).toFixed(3);
  const vw=window.innerWidth;
  let cols;
  if(isPPT){
    if(vw<480)cols='repeat(2,1fr)';
    else if(vw<768)cols='repeat(3,1fr)';
    else cols='repeat(auto-fill,minmax(260px,1fr))';
  }else{
    if(vw<480)cols='repeat(3,1fr)';
    else if(vw<768)cols='repeat(4,1fr)';
    else cols='repeat(auto-fill,minmax(160px,1fr))';
  }
  el.style.gridTemplateColumns=cols;
  el.innerHTML='';
  designs.forEach(d=>{
    const it=document.createElement('div');
    it.className='gi';
    // padding-top trick: maintains aspect ratio, inner slide scales via transform
    it.innerHTML=`<div class="pw" style="position:relative;overflow:hidden;width:100%;padding-top:${ratio}%;background:#fff"><div class="svw" style="position:absolute;top:0;left:0;width:${BW}px;height:${BH}px;transform-origin:top left">${d.render(BW,BH,1)}</div><div class="dn" style="z-index:3">${String(d.id).padStart(2,'0')}</div></div><div class="ii"><div class="nm">${d.name}</div><div class="tg">${d.tag}</div></div>`;
    it.onclick=()=>{
      const sc=isPPT?1.9:1.65;
      document.getElementById('mpr').innerHTML=makeSlide(d,type,sc);
      document.getElementById('mnm').textContent=d.name;
      document.getElementById('mtg').textContent=d.tag;
      document.getElementById('mmt').textContent=`#${d.id} · ${isPPT?'PPT 슬라이드':'카드뉴스'} 디자인`;
      const pm=isPPT?PP:CP;
      document.getElementById('mprompt').textContent=pm[d.id]||d.name+' — '+d.tag;
      const cb=document.getElementById('mcopy');cb.textContent='복사';cb.style.background='rgba(255,255,255,.08)';cb.style.color='rgba(255,255,255,.6)';
      document.getElementById('ovl').classList.add('on');
    };
    el.appendChild(it);
  });
  // scale each thumbnail to fit container width
  function applyScales(){
    el.querySelectorAll('.pw').forEach(pw=>{
      const w=pw.offsetWidth;
      if(w>0){const svw=pw.querySelector('.svw');if(svw)svw.style.transform=`scale(${w/BW})`;}
    });
  }
  requestAnimationFrame(()=>setTimeout(applyScales,30));
  window.addEventListener('resize',()=>{
    const vw=window.innerWidth;
    if(isPPT){
      if(vw<480)el.style.gridTemplateColumns='repeat(2,1fr)';
      else if(vw<768)el.style.gridTemplateColumns='repeat(3,1fr)';
      else el.style.gridTemplateColumns='repeat(auto-fill,minmax(260px,1fr))';
    }else{
      if(vw<480)el.style.gridTemplateColumns='repeat(3,1fr)';
      else if(vw<768)el.style.gridTemplateColumns='repeat(4,1fr)';
      else el.style.gridTemplateColumns='repeat(auto-fill,minmax(160px,1fr))';
    }
    applyScales();
  });
}

function selectAll(el){
  const r=document.createRange();r.selectNodeContents(el);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}
function copyPrompt(){
  const t=document.getElementById('mprompt').textContent;
  const b=document.getElementById('mcopy');
  function ok(){
    b.textContent='✅ 복사됨!';b.style.background='#0a2a0a';b.style.color='#4ade80';b.style.borderColor='#4ade80';
    setTimeout(()=>{b.textContent='📋 복사';b.style.background='#222';b.style.color='#aaa';b.style.borderColor='#333';},2500);
  }
  function fallback(){
    const el=document.createElement('textarea');
    el.value=t;el.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(el);el.focus();el.select();
    try{document.execCommand('copy');ok();}catch(e){
      b.textContent='⚠ 직접 선택하세요';b.style.color='#facc15';
      setTimeout(()=>{b.textContent='📋 복사';b.style.color='#aaa';},3000);
    }
    document.body.removeChild(el);
  }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(ok).catch(fallback);
  } else {
    fallback();
  }
}
